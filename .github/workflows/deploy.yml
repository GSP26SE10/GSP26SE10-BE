name: Auto Deploy to Local Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          cd BookfetSystem/BookfetSystem.API
          dotnet publish -c Release -o publish

      - name: Kill old API (safe)
        shell: powershell
        run: |
          $port = 5121
          $lines = netstat -ano | findstr ":$port"

          if (-not $lines) {
          Write-Host "No process using port $port"
          exit 0
          }

          foreach ($line in $lines) {
          $parts = $line -split "\s+"
          $procId = $parts[-1]

           if ($procId -match "^\d+$") {
           try {
           Stop-Process -Id $procId -Force -ErrorAction Stop
           Write-Host "Killed process $procId"
          } catch {
          Write-Host "Cannot kill process $procId"
             }
            }
          }

      - name: Start new app
        shell: powershell
        run: |
          $projectDir = "$env:GITHUB_WORKSPACE/BookfetSystem/BookfetSystem.API"

          Start-Process -FilePath "dotnet" `
            -ArgumentList "run --configuration Release" `
            -WorkingDirectory $projectDir
