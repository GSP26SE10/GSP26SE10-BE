name: Auto Deploy to Local Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          cd BookfetSystem/BookfetSystem.API
          dotnet publish -c Release -o publish

      - name: Kill old app
        run: |
          taskkill /IM BookfetSystem.API.exe /F || echo "No app running"

      - name: Start new app
        shell: powershell
        run: |
          $projectDir = "$env:GITHUB_WORKSPACE/BookfetSystem/BookfetSystem.API"
          cd $projectDir
          start cmd /c "dotnet run --configuration Release"