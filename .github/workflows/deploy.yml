name: Auto Deploy to Local Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Fix git safe directory
        shell: powershell
        run: |
          git config --global --add safe.directory C:/Code/GSP26SE10-BE
          
      - name: Pull latest code (REAL)
        shell: powershell
        run: |
          cd C:\Code\GSP26SE10-BE
          git fetch origin
          git reset --hard origin/main

      - name: Build project
        shell: powershell
        run: |
          cd C:\Code\GSP26SE10-BE\BookfetSystem\BookfetSystem.API
          dotnet publish -c Release -o publish

      - name: Kill old API
        shell: powershell
        run: |
          Write-Host "Stopping all dotnet processes..."
          taskkill /F /IM dotnet.exe /T
          exit 0

      - name: Start new app
        shell: powershell
        run: |
          $projectDir = "C:\Code\GSP26SE10-BE\BookfetSystem\BookfetSystem.API"

          Write-Host "Starting app from $projectDir"
          
          Start-Process -FilePath "dotnet" `
            -ArgumentList "run --configuration Release --urls=http://0.0.0.0:5121" `
            -WorkingDirectory $projectDir
