name: Deploy BookfetSystem.API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          dotnet-install-dir: "${{ runner.temp }}\\dotnet"

      - name: Restore and build API
        run: |
          dotnet restore "BookfetSystem/BookfetSystem.API/BookfetSystem.API.csproj"
          dotnet build "BookfetSystem/BookfetSystem.API/BookfetSystem.API.csproj" -c Release --no-restore

      - name: Stop old API process
        run: |
          $running = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq "dotnet.exe" -and $_.CommandLine -like "*BookfetSystem.API*"
          }
          if ($running) {
            $running | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
            Write-Host "Stopped old BookfetSystem.API dotnet process."
          } else {
            Write-Host "No old BookfetSystem.API dotnet process found."
          }

      - name: Start new API process
        run: |
          $projectDir = "$env:GITHUB_WORKSPACE/BookfetSystem/BookfetSystem.API"
          Start-Process -FilePath "dotnet" -ArgumentList "run --no-build --configuration Release" -WorkingDirectory $projectDir
          Write-Host "Started BookfetSystem.API with dotnet run."